<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Інтерпретатор чисел</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Інтерпретатор чисел</h1>
        <p class="subtitle">Діапазон: від -100000 до 100000</p>

        <div class="input-box">
            <input type="number" id="numberInput" placeholder="Введіть число..." min="-100000" max="100000" />
            <button id="interpretBtn">Інтерпретувати</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
