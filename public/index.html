<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Інтерпретатор чисел</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #12141a;
    color: #eaeaea;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #1c1f28;
    padding: 2rem 2.5rem;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    width: min(420px, 90vw);
  }
  h1 { font-size: 1.3rem; margin-top: 0; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #3a3f4b;
    background: #12141a;
    color: #eaeaea;
    margin-bottom: 0.8rem;
  }
  button {
    width: 100%;
    padding: 0.6rem;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    background: #4f7cff;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #3d64e0; }
  .result {
    margin-top: 1.2rem;
    font-size: 1.1rem;
    min-height: 1.5rem;
    word-break: break-word;
  }
  .error { color: #ff6b6b; }
  small { color: #8a90a0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Інтерпретатор чисел</h1>
    <small>Діапазон: від -100000 до 100000</small>
    <input id="numberInput" type="number" min="-100000" max="100000" placeholder="Введіть число, напр. -4205" />
    <button id="interpretBtn">Інтерпретувати</button>
    <div id="result" class="result"></div>
  </div>

<script>
  const input = document.getElementById('numberInput');
  const btn = document.getElementById('interpretBtn');
  const result = document.getElementById('result');

  async function interpret() {
    const value = input.value;
    result.textContent = '';
    result.classList.remove('error');

    if (value === '') return;

    try {
      const res = await fetch(`/interpret?number=${encodeURIComponent(value)}`);
      const data = await res.json();

      if (!res.ok) {
        result.textContent = data.error;
        result.classList.add('error');
        return;
      }

      result.textContent = data.result;
    } catch (e) {
      result.textContent = 'Помилка з\'єднання з сервером';
      result.classList.add('error');
    }
  }

  btn.addEventListener('click', interpret);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') interpret(); });
</script>
</body>
</html>
